    <!-- Content is only hidden for the scroll reveal once this class is set, and it is
         set here, before the first paint, so nothing flashes visible and then hides.
         If the page never starts the reveal system (a script error), the failsafe
         removes the class so the content is shown rather than stuck hidden. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("reveal-ready");
        setTimeout(function () {
          if (!root.hasAttribute("data-reveal-live")) root.classList.remove("reveal-ready");
        }, 3000);
      })();
    </script>
